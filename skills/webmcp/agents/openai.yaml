interface:
  display_name: "WebMCP"
  short_description: "Open pages and use WebMCP first"
  default_prompt: "Use $webmcp with the URL and full request. Open or reuse only the host's visible built-in/in-app browser tab, never a matching Chrome or Edge tab; preserve the exact URL. Wait for sign-in if needed, then make one bounded discovery pass: use an exposed host bridge or relay, otherwise call document.modelContext.getTools() and executeTool() in the live page evaluator and explicitly surface its serializable result. Inspect schemas for composite operations before declaring a capability missing. Do not use generic tool search, unrelated app connectors, or ask_app unless bound to the current tab. Do not mistake an accessibility tree for evaluator output, probe unsupported wrappers, guess signatures, or fall back to UI automation unless the user explicitly requests it for this operation."
