interface:
  display_name: "WebMCP"
  short_description: "Open pages and use WebMCP first"
  default_prompt: "Use $webmcp with the URL or app alias and the request. With no request, open the exact URL in the visible built-in/in-app browser, confirm it loaded, and stop. For an operation, check sign-in, then call the page helper window.__agentNativeWebMcp from a same-world evaluator (Codex: read capabilities/tab/cdp once, then CDP Runtime.evaluate; never Playwright). One view-screen call for ids, one smallest mutation, one targeted readback, then report. The CDP evaluator dies at about 3 s, so pass { waitMs: 0 } to call() and read result(id) on the next evaluation; a timed-out evaluator is an unread result, not a failed write. Treat Internal server error as a server failure to report, not an argument to guess at. Do not use generic tool search, unrelated connectors, ask_app, reloads, screenshots, or UI automation when a matching page tool exists."
