interface:
  display_name: "WebMCP"
  short_description: "Open pages and use WebMCP first"
  default_prompt: "Use $webmcp with the URL and request. With no request, open the exact URL in the visible built-in/in-app browser, confirm it loaded, and stop without eager tool discovery. For an operation, wait for sign-in if needed, then make one bounded discovery pass: use an exposed host bridge or relay, otherwise call document.modelContext.getTools() and executeTool() in a same-world evaluator, using Codex CDP Runtime.evaluate before Playwright because Playwright may be isolated. Native WebMCP/polyfill use JSON.stringify(args); the current Codex page adapter uses the schema-shaped object. Follow the active host contract without retrying both. Explicitly surface serializable results, read through any appended evaluator output, inspect composite schemas, and read back writes. Do not use generic tool search, unrelated connectors, ask_app, unsupported wrappers, guessed signatures, or UI automation when a matching page tool exists."
